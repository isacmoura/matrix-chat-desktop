[package]
name = "matrix_desktop_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
futures-util = "0.3"
getrandom = "0.3"
keyring = "3.6"
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite"] }
matrix-sdk-ui = "=0.19.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
